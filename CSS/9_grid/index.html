<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 200px 1fr 2fr;
        grid-template-rows: 100px 150px;
        gap: 20px;
      }
      .item1 {
        grid-column: 1/3;
        grid-row: 1 / span 2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item1">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
  </body>
</html>
