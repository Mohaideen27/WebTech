<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        position: relative;
      }
      .b1 {
        height: 50%;
        background-color: blue;
      }
      .b2 {
        height: 50%;
        background-color: brown;
      }
      .container {
        height: 70%;
        width: 70%;
        border-radius: 20px;
        background-color: white;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="b1"></div>
    <div class="b2"></div>
    <div class="container"></div>
  </body>
</html>
