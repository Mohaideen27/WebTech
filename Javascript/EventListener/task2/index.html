<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Employee Table</h1>
    <form action="">
      <input type="text" id="eName" placeholder="Enter your name" />
      <input type="text" id="eId" placeholder="Enter your id" />
      <input type="text" id="eDept" placeholder="Enter your dept" />
      <input type="text" id="eSalary" placeholder="Enter your salary" />
      <button>submit</button>
    </form>
    <table border="1">
      <tr>
        <th>Name</th>
        <th>id</th>
        <th>dept</th>
        <th>salary</th>
      </tr>
      
    </table>
    <script src="script.js"></script>
  </body>
</html>
